name: Build Mobile APKs (Flutter & Android Native)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === MÁY ẢO 1: BUILD FLUTTER ===
  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4 # Đã nâng lên v4

      - name: Setup Java 17
        uses: actions/setup-java@v4 # Đã nâng lên v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tải thư viện Flutter
        run: flutter pub get
        working-directory: ./Flutter_App

      - name: Build Flutter APK (Release)
        run: flutter build apk --release
        working-directory: ./Flutter_App

      - name: Lưu file Flutter APK
        uses: actions/upload-artifact@v4 # Đã nâng lên v4
        with:
          name: QR_Flutter_APK
          path: Flutter_App/build/app/outputs/flutter-apk/app-release.apk

  # === MÁY ẢO 2: BUILD ANDROID NATIVE ===
  build-android-native:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4 # Đã nâng lên v4

      - name: Setup Java 17
        uses: actions/setup-java@v4 # Đã nâng lên v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cấp quyền chạy Gradle
        run: chmod +x ./gradlew
        working-directory: ./Android_Native

      - name: Build Android APK (Debug)
        run: ./gradlew assembleDebug
        working-directory: ./Android_Native

      - name: Lưu file Android Native APK
        uses: actions/upload-artifact@v4 # Đã nâng lên v4
        with:
          name: QR_Android_Native_APK
          path: Android_Native/app/build/outputs/apk/debug/app-debug.apk
