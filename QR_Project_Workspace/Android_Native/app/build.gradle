plugins { id 'com.android.application' }

android {
    namespace 'com.demo.qr'
    compileSdk 36
    defaultConfig { applicationId 'com.demo.qr'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
    buildFeatures { viewBinding false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // ML Kit - QR Scanning (thay thế ZXing Android cho việc quét)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ZXing Core - chỉ dùng để GENERATE QR bitmap (không có Android wrapper gây lỗi Gradle 9)
    implementation 'com.google.zxing:core:3.5.3'

    // Guava - bắt buộc cho CameraX ListenableFuture
    implementation 'com.google.guava:guava:33.4.8-android'
}
