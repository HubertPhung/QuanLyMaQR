# Bắt buộc để dùng thư viện AndroidX (appcompat, camera, recyclerview...)
android.useAndroidX=true

# Trỏ Gradle dùng JDK 21 tích hợp sẵn trong Android Studio (thay vì Java 8 hệ thống)
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Tự động migrate các support library cũ sang AndroidX
android.enableJetifier=true

# Tăng hiệu suất build với Gradle Daemon
org.gradle.daemon=true

# Cấp thêm RAM cho Gradle khi build dự án lớn
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# Bật cấu hình build (tắt parallel và vfs watch trên Windows để tránh xung đột khóa file)
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.suppressUnsupportedCompileSdk=36
